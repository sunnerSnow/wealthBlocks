<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>財富積木 Kids 原型</title>
<meta name="theme-color" content="#F7F2E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Wealth Blocks 財富積木 — Kids MVP 視覺與操作原型
   色彩依規格書 7.2；--ink-2 / --coral-ink / --teal-ink 為了小字對比度加深
   ========================================================= */
:root{
  --cream:#F7F2E8; --cream-2:#EFE7D8; --cream-3:#E4D9C4;
  --navy:#20334F; --navy-2:#2C4466; --navy-deep:#16243A; --navy-soft:#E3E8F0;
  --yellow:#FFD34E; --yellow-deep:#E2B22F; --yellow-soft:#FFF1C2;
  --teal:#56B7A5; --teal-deep:#3F9886; --teal-soft:#DDF1EC; --teal-ink:#2D7A6B;
  --white:#FFFFFF;
  --slate:#6E7C8F; --ink-2:#56647A;
  --coral:#C95D43; --coral-ink:#A8452E; --coral-soft:#F8E3DC;
  --line:rgba(32,51,79,.12);
  --shadow-card:0 1px 0 rgba(32,51,79,.05), 0 12px 28px -18px rgba(32,51,79,.35);
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px;
  --font-zh:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Fredoka",var(--font-zh);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--navy);font-family:var(--font-zh);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.3;margin:0}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.num{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}

/* ---------- 預覽工具列（僅原型用） ---------- */
.stage{min-height:100dvh;display:flex;flex-direction:column}
.preview-bar{display:none}
.device{position:relative;width:100%;height:100dvh;overflow:hidden;background:var(--cream);container:app / inline-size}
@media (min-width:900px){
  .preview-bar{display:flex;align-items:center;gap:16px;height:52px;padding:0 20px;background:var(--navy-deep);color:#C9D3E1;font-size:14px;flex:none}
  .pv-title b{color:#fff;font-family:var(--font-num);font-weight:600;margin-right:6px}
  .pv-seg{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px;margin-left:auto}
  .pv-seg button{border:0;background:none;color:#C9D3E1;padding:6px 14px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700}
  .pv-seg button[aria-pressed="true"]{background:var(--yellow);color:var(--navy)}
  .pv-note{opacity:.75}
  .pv-reset{border:1px solid rgba(255,255,255,.25);background:none;color:#fff;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:14px}
  .preview-bar :focus-visible{outline-color:var(--yellow)}
  body[data-preview="phone"] .stage,body[data-preview="tablet"] .stage{background:#E6DECD}
  body[data-preview="phone"] .device{width:390px;height:min(844px,calc(100dvh - 92px));margin:20px auto;border-radius:44px;box-shadow:0 0 0 10px var(--navy-deep),0 40px 60px -30px rgba(22,36,58,.6)}
  body[data-preview="tablet"] .device{width:min(820px,calc(100vw - 60px));height:min(1100px,calc(100dvh - 92px));margin:20px auto;border-radius:30px;box-shadow:0 0 0 10px var(--navy-deep),0 40px 60px -30px rgba(22,36,58,.6)}
  body[data-preview="desktop"] .device{height:calc(100dvh - 52px)}
}

/* ---------- App 版面 ---------- */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "tab"}
.topbar{grid-area:top}
.main{grid-area:main;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 32px;scroll-behavior:smooth}
.tabbar{grid-area:tab}
.sidenav{grid-area:side;display:none}
.rail{grid-area:rail;display:none}
.app.is-building .tabbar{display:none}
@container app (min-width:768px){
  .app{grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "side main"}
  .app .tabbar{display:none}
  .app .sidenav{display:flex}
  .main{padding:24px 28px 40px}
}
@container app (min-width:1180px){
  .app{grid-template-columns:228px minmax(0,1fr) 340px;grid-template-areas:"top top top" "side main rail"}
  .rail{display:block;overflow-y:auto;border-left:1px solid var(--line);padding:22px 20px 40px}
  .main{padding:26px 36px 48px}
}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--cream);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:9px;color:var(--navy);text-decoration:none;border-radius:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand-text,.mode-badge,.top-level{white-space:nowrap}
.brand-text b{display:block;font-size:17px;font-weight:800;letter-spacing:.06em;line-height:1.15}
.brand-text small{display:block;font-family:var(--font-num);font-size:11px;font-weight:500;color:var(--ink-2);letter-spacing:.08em;line-height:1.15}
.mode-badge{display:none;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal-ink);font-size:13px;font-weight:700}
.top-spacer{flex:1}
.top-level{display:none;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-right:6px}
.top-level .xpbar{width:120px}
.lv-badge{display:inline-grid;place-items:center;height:26px;padding:0 9px;border-radius:8px;background:var(--navy);color:var(--yellow);font-family:var(--font-num);font-weight:600;font-size:14px;box-shadow:0 3px 0 var(--navy-deep)}
.coinpill{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 7px;border:0;border-radius:999px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 rgba(32,51,79,.08);font-family:var(--font-num);font-weight:600;font-size:19px;transition:transform .15s}
.coinpill svg{width:28px;height:28px}
.coinpill:hover{box-shadow:inset 0 0 0 1.5px var(--navy),0 3px 0 rgba(32,51,79,.12)}
.coinpill.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.14)}60%{transform:scale(.97)}}
.avatar-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;min-height:44px;border-radius:999px}
.avatar-name{display:none;font-weight:700}
.av{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--yellow-soft);box-shadow:inset 0 0 0 2px #fff,0 0 0 1.5px var(--line);overflow:hidden;flex:none}
.av svg{width:84%;height:84%;margin-top:14%}
@container app (min-width:768px){
  .topbar{padding:12px 24px}
  .mode-badge{display:inline-flex}
  .top-level{display:flex}
}
@container app (min-width:1180px){
  .avatar-name{display:inline}
  .avatar-btn{padding-right:6px}
}

/* ---------- 導覽 ---------- */
.sidenav{flex-direction:column;gap:6px;padding:16px 10px;border-right:1px solid var(--line);overflow-y:auto}
.navlink{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;min-height:66px;border:0;border-radius:16px;background:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);position:relative;transition:background .15s,color .15s}
.navlink .ic{width:24px;height:24px}
.navlink:hover{background:rgba(32,51,79,.06);color:var(--navy)}
.navlink[aria-current="page"]{background:var(--navy);color:#fff;box-shadow:0 4px 0 var(--navy-deep)}
.navlink[aria-current="page"] .ic{color:var(--yellow)}
.navlink:focus-visible{outline-offset:2px}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-dot{position:absolute;top:6px;right:16px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--coral);color:#fff;font-family:var(--font-num);font-size:11px;line-height:18px;text-align:center}
@container app (min-width:1180px){
  .sidenav{padding:22px 16px}
  .navlink{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 16px;min-height:52px;font-size:16px}
  .nav-dot{position:static;margin-left:auto}
}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));position:relative;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:2px 0;min-height:56px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;position:relative}
.tab .ti{display:grid;place-items:center;width:54px;height:30px;border-radius:999px;transition:background .2s}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--navy)}
.tab[aria-current="page"] .ti{background:var(--yellow)}
.tab .nav-dot{top:0;right:calc(50% - 26px)}

/* ---------- 按鈕 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:var(--r-md);font-weight:700;font-size:16px;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s ease,box-shadow .12s ease,background .15s}
.btn .ic{width:20px;height:20px}
.btn-primary{background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 var(--yellow-deep)}
.btn-primary:hover{background:#FFDA68}
.btn-secondary{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy),0 4px 0 var(--navy)}
.btn-secondary:hover{background:var(--cream)}
.btn-success{background:var(--teal);color:var(--navy);box-shadow:0 4px 0 var(--teal-deep)}
.btn-success:hover{background:#66C0AF}
.btn-danger{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-ink)}
.btn-ghost{background:none;color:var(--navy);min-height:44px;padding:0 12px}
.btn-ghost:hover{background:rgba(32,51,79,.06)}
.btn:not([disabled]):active{transform:translateY(3px)}
.btn-primary:not([disabled]):active{box-shadow:0 1px 0 var(--yellow-deep)}
.btn-secondary:not([disabled]):active{box-shadow:inset 0 0 0 2px var(--navy),0 1px 0 var(--navy)}
.btn-success:not([disabled]):active{box-shadow:0 1px 0 var(--teal-deep)}
.btn[disabled]{background:var(--cream-3);color:#7A8597;box-shadow:0 4px 0 #D2C6AE;cursor:not-allowed}
.btn-sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn[aria-busy="true"]::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{border:0;background:none;padding:6px 4px;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;text-decoration-color:var(--yellow-deep)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}
.icon-btn:hover{box-shadow:inset 0 0 0 1.5px var(--navy)}

/* ---------- 共用元件 ---------- */
.card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-card);border:1px solid rgba(32,51,79,.06)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-size:24px;font-weight:800;letter-spacing:.03em}
.view-head p{margin-top:4px;color:var(--ink-2);font-size:15px;max-width:520px}
@container app (min-width:768px){.view-head h1{font-size:28px}}
.sec-title{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:800;margin:0 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border:0;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chip:hover{color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:none}
.xpbar{display:block;height:10px;border-radius:999px;background:var(--cream-3);overflow:hidden;box-shadow:inset 0 1px 2px rgba(32,51,79,.12)}
.xpbar i{display:block;height:100%;border-radius:inherit;background:var(--yellow);box-shadow:inset 0 -3px 0 var(--yellow-deep);transition:width .5s ease}
.cat{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:8px;font-size:13px;font-weight:700;flex:none}
.cat .ic{width:16px;height:16px}
.cat-earn{background:var(--yellow-soft);color:#6B4E00}
.cat-spend{background:var(--coral-soft);color:var(--coral-ink)}
.cat-save{background:var(--teal-soft);color:var(--teal-ink)}
.cat-plan{background:var(--navy-soft);color:var(--navy)}
.cat-share{background:var(--coral-soft);color:var(--coral-ink)}
.cat-risk{background:var(--cream-2);color:var(--ink-2)}
.coin-sm{width:18px;height:18px;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:700;background:var(--cream-2);color:var(--ink-2);white-space:nowrap}
.badge .ic{width:14px;height:14px}
.badge-ok{background:var(--teal-soft);color:var(--teal-ink)}
.badge-lock{background:var(--navy-soft);color:var(--navy)}
.badge-goal{background:var(--yellow-soft);color:#6B4E00}
.empty{padding:22px;text-align:center;color:var(--ink-2);font-size:15px}
.empty .btn{margin-top:12px}

/* 積木進度條：一塊積木 = 10% */
.bricks{display:flex;gap:4px;padding-top:5px}
.bricks i{position:relative;flex:1;height:16px;border-radius:4px;background:var(--cream-3)}
.bricks i::before{content:"";position:absolute;top:-4px;left:50%;width:44%;height:5px;transform:translateX(-50%);border-radius:2px 2px 0 0;background:var(--cream-3)}
.bricks i.on,.bricks i.on::before{background:var(--teal)}
.bricks i.on{box-shadow:inset 0 -3px 0 var(--teal-deep)}
.bricks i.part{background:linear-gradient(90deg,var(--teal) var(--p),var(--cream-3) var(--p))}
.bricks.yellow i.on,.bricks.yellow i.on::before{background:var(--yellow)}
.bricks.yellow i.on{box-shadow:inset 0 -3px 0 var(--yellow-deep)}
.bricks.yellow i.part{background:linear-gradient(90deg,var(--yellow) var(--p),var(--cream-3) var(--p))}

/* ---------- 積木島 ---------- */
.xpstrip{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;font-weight:700}
.xpstrip .xpbar{flex:1}
.xpstrip .num{font-size:14px;color:var(--ink-2)}
@container app (min-width:768px){.xpstrip{display:none}}
.board-wrap{max-width:600px;margin:0 auto}
.board-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.board-title{font-size:20px;font-weight:800;letter-spacing:.03em}
.board-meta{font-size:14px;color:var(--ink-2)}
.board{position:relative;aspect-ratio:1;padding:4.5%;border-radius:26px;background:radial-gradient(120% 95% at 50% 42%,#C4E9EE 0%,#A4DAE3 55%,#8DCDD8 100%);box-shadow:inset 0 0 0 1.5px rgba(32,51,79,.08),0 14px 30px -20px rgba(32,51,79,.55);container-type:inline-size;overflow:hidden;user-select:none;-webkit-user-select:none}
.wave{position:absolute;width:9%;opacity:.8;pointer-events:none}
.boat{position:absolute;width:10%;pointer-events:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%) rotate(-3deg)}}
.grid{position:relative;width:100%;height:100%}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr)}
.cell{display:block}
.cell.l{background:radial-gradient(circle at 50% 43%,#BCE0A0 0 18%,transparent 19%),radial-gradient(circle at 50% 55%,#80B567 0 18%,transparent 19%),#9DCB80}
.cell.tl{border-top-left-radius:36%}.cell.tr{border-top-right-radius:36%}
.cell.bl{border-bottom-left-radius:36%}.cell.br{border-bottom-right-radius:36%}
.cell.eb{box-shadow:0 1.9cqi 0 #73A85A,0 3cqi 0 rgba(32,51,79,.10)}
.gridlines{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(to right,rgba(32,51,79,.13) 1px,transparent 1px) 0 0/calc(100%/9) 100%,linear-gradient(to bottom,rgba(32,51,79,.13) 1px,transparent 1px) 0 0/100% calc(100%/9)}
.building .gridlines{opacity:1}
.objs{position:absolute;inset:0}
.obj{position:absolute;padding:0;border:0;background:none;cursor:pointer;pointer-events:none;border-radius:6px}
.obj svg{display:block;width:100%;height:100%;overflow:visible}
.obj svg>*{pointer-events:visiblePainted}
.obj:focus-visible{outline-offset:0}
.obj:hover svg{filter:brightness(1.05)}
.grid.placing .obj svg>*{pointer-events:none}
.obj.sel svg{filter:drop-shadow(0 2px 0 var(--yellow)) drop-shadow(0 -2px 0 var(--yellow)) drop-shadow(2px 0 0 var(--yellow)) drop-shadow(-2px 0 0 var(--yellow)) drop-shadow(0 4px 6px rgba(32,51,79,.35));animation:selbob 1.2s ease-in-out infinite}
@keyframes selbob{50%{transform:translateY(-3%)}}
.obj.moving{opacity:.35}
.obj.moving svg{animation:none}
.obj.pop svg{animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{0%{transform:translateY(-30%);opacity:0}60%{opacity:1}100%{transform:none}}
.grid.placing{touch-action:none;cursor:crosshair}
.grid:focus-visible{outline:3px solid var(--navy);outline-offset:4px;border-radius:14px}
.fp{position:absolute;z-index:900;pointer-events:none;border-radius:12%;box-shadow:inset 0 0 0 .7cqi currentColor;background:color-mix(in srgb,currentColor 24%,transparent)}
.fp.ok{color:var(--teal-deep)}
.fp.bad{color:var(--coral)}
.ghost{position:absolute;z-index:901;pointer-events:none;opacity:.9;transition:left .08s,bottom .08s}
.ghost svg{display:block;width:100%;height:100%;overflow:visible}
.ghost.bad{opacity:.5;filter:grayscale(.5)}
.fab{position:absolute;right:3.2%;bottom:3.2%;z-index:950;min-height:46px;padding:0 16px}
.island-name{position:absolute;left:3.5%;top:3.5%;z-index:950}

/* 建造工具列 */
.tray{max-width:600px;margin:14px auto 0;padding:14px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-card);border:1px solid rgba(32,51,79,.06)}
.tray-head{display:flex;align-items:flex-start;gap:12px}
.tray-head b{font-size:17px}
.tray-status{font-size:14px;color:var(--ink-2);margin-top:2px;min-height:22px}
.tray-status.ok{color:var(--teal-ink);font-weight:700}
.tray-status.bad{color:var(--coral-ink);font-weight:700}
.tray-items{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:thin}
.ichip{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:86px;padding:8px 6px 6px;border:2px solid transparent;border-radius:16px;background:var(--cream);cursor:pointer;font-size:13px;font-weight:700}
.ichip svg{height:46px;width:56px}
.ichip:hover{border-color:var(--line)}
.ichip[aria-pressed="true"]{border-color:var(--navy);background:var(--yellow-soft)}
.ichip .cnt{position:absolute;top:4px;right:5px;min-width:24px;height:20px;padding:0 6px;border-radius:999px;background:var(--navy);color:#fff;font-family:var(--font-num);font-size:12px;line-height:20px}
.tray-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tray-actions .btn{flex:1}
.view-island.building{min-height:100%;display:flex;flex-direction:column}
.view-island.building .board-wrap{width:100%;margin-bottom:14px}
.view-island.building .tray{width:100%;margin:0 auto}
@container app (min-width:768px){
  .view-island.building .board-wrap,.view-island.building .tray{max-width:max(360px,min(600px,calc(100dvh - 460px)))}
}
@container app (max-width:767px){
  .app.is-building .main{padding-bottom:0}
  .view-island.building .tray{width:auto;max-width:none;margin:auto -16px 0}
  .tray{position:sticky;bottom:0;border-radius:22px 22px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 28px -16px rgba(32,51,79,.45)}
}

/* 首頁卡片（手機/平板；桌面改放右側欄） */
.island-cards{display:grid;gap:18px;max-width:600px;margin:20px auto 0}
@container app (min-width:768px){.island-cards{grid-template-columns:1fr 1fr}.island-cards .span-all{grid-column:1/-1}}
@container app (min-width:1180px){.island-cards{display:none}}
.welcome{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r-lg);background:var(--navy);color:#fff;box-shadow:0 5px 0 var(--navy-deep)}
.welcome h2{font-size:18px;color:var(--yellow)}
.welcome p{font-size:15px;color:#DCE3EE;margin:4px 0 12px}
.welcome-art{display:flex;align-items:flex-end;flex:none;width:76px;height:72px;padding:4px;border-radius:16px;background:rgba(255,255,255,.08)}
.welcome-art svg{height:100%;width:50%}
.nudge{display:flex;align-items:center;gap:12px;padding:14px 16px}
.nudge p{flex:1;font-size:15px;font-weight:700}

/* ---------- 任務卡 ---------- */
.qgrid{display:grid;gap:14px}
@container app (min-width:768px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qcard{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-card);border:1px solid rgba(32,51,79,.06);overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--qc,var(--yellow))}
.qcard.c-earn{--qc:var(--yellow)}.qcard.c-spend{--qc:var(--coral)}.qcard.c-save{--qc:var(--teal)}.qcard.c-plan{--qc:var(--navy)}.qcard.c-share{--qc:#E0907A}.qcard.c-risk{--qc:var(--slate)}
.qcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qcard h3{font-size:19px;font-weight:800;margin-top:4px}
.qcard p{font-size:15px;color:var(--ink-2)}
.qcard-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.rewards{display:flex;gap:6px;flex-wrap:wrap}
.rw{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 7px;border-radius:999px;background:var(--cream);font-family:var(--font-num);font-weight:600;font-size:15px}
.rw .ic{width:16px;height:16px;color:var(--yellow-deep)}
.rw-done{font-family:var(--font-zh);font-size:13px;color:var(--ink-2);font-weight:700}
.qstate{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
.qstate .ic{width:16px;height:16px}
.qstate.done{color:var(--teal-ink)}
.qstate.locked{color:var(--ink-2)}
.qcard.locked{background:var(--cream-2);box-shadow:none}
.qcard.locked h3,.qcard.locked p{color:var(--ink-2)}
.qcard-note{font-size:14px!important;padding:8px 10px;border-radius:10px;background:var(--teal-soft);color:var(--teal-ink)!important;font-weight:700}
.qprogress{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:16px}
.qprogress b{font-size:15px;white-space:nowrap}
.qprogress .bricks{flex:1}

/* ---------- 商店 ---------- */
.shop-head-right{display:flex;align-items:center;gap:10px}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container app (min-width:600px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (min-width:1180px){.sgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}}
.scard{display:flex;flex-direction:column;padding:0;border:0;text-align:left;cursor:pointer;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-card);border:1px solid rgba(32,51,79,.06);overflow:hidden;transition:transform .15s,box-shadow .15s}
.scard:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(32,51,79,.05),0 18px 30px -18px rgba(32,51,79,.45)}
.scard-art{display:grid;place-items:center;height:118px;padding:12px;background:radial-gradient(circle at 50% 50%,#FBF7EF 0 40%,transparent 41%) 0 0/22px 22px,var(--cream-2)}
.scard-art svg{max-height:100%;max-width:78%;height:100%}
.scard-body{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.scard-body b{font-size:16px}
.scard-cat{font-size:13px;color:var(--ink-2)}
.scard-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;flex-wrap:wrap}
.price{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-num);font-weight:600;font-size:18px}
.price .coin-sm{width:20px;height:20px}
.scard.dim .scard-art{filter:saturate(.35);opacity:.8}

/* ---------- 儲蓄目標 ---------- */
.ggrid{display:grid;gap:14px}
@container app (min-width:900px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gcard{display:flex;gap:14px;padding:16px}
.gcard-art{position:relative;flex:none;display:grid;place-items:center;width:92px;height:104px;border-radius:16px;background:var(--cream-2)}
.gcard-art svg{width:80%;height:86%}
.gcard-art.locked svg{filter:grayscale(1) contrast(.8);opacity:.45}
.gcard-art .lockdot{position:absolute;right:-6px;top:-6px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--yellow);box-shadow:0 3px 0 var(--navy-deep)}
.gcard-art .lockdot .ic{width:16px;height:16px}
.gcard-art .ic.big{width:40px;height:40px;color:var(--teal-deep)}
.gcard-body{flex:1;min-width:0}
.gcard-title{display:flex;align-items:center;gap:8px;justify-content:space-between}
.gcard-title h3{font-size:18px;font-weight:800}
.gnums{display:flex;align-items:baseline;gap:4px;margin-top:4px;font-size:14px;color:var(--ink-2)}
.gnums .num.big{font-size:26px;color:var(--navy)}
.gnums .gpct{margin-left:auto;font-family:var(--font-num);font-weight:600;font-size:16px;color:var(--teal-ink)}
.gleft{font-size:14px;color:var(--ink-2);margin-top:8px}
.gleft b{color:var(--navy);font-family:var(--font-num)}
.gactions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.gactions .btn{flex:1}
.ghint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:16px;border-radius:14px;background:var(--teal-soft);color:var(--teal-ink);font-size:15px;font-weight:500}
.ghint .ic{margin-top:2px}
.gmini{display:flex;gap:12px;align-items:center;padding:14px}
.gmini-art{flex:none;display:grid;place-items:center;width:60px;height:66px;border-radius:12px;background:var(--cream-2)}
.gmini-art svg{width:84%;height:88%}
.gmini-art.locked svg{filter:grayscale(1);opacity:.5}
.gmini-body{flex:1;min-width:0}
.gmini-body b{font-size:16px}
.gmini-body small{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}

/* ---------- 個人 ---------- */
.me-grid{display:grid;gap:14px}
@container app (min-width:900px){.me-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.me-grid .span-all{grid-column:1/-1}}
.me-sec{padding:16px}
.me-sec h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.profile{display:flex;gap:16px;align-items:center}
.profile .av{width:84px;height:84px}
.profile h2{margin:0 0 2px;font-size:22px}
.profile .meta{font-size:14px;color:var(--ink-2)}
.profile .xpbar{margin-top:8px;max-width:260px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:10px 12px;border-radius:14px;background:var(--cream)}
.stat small{display:block;font-size:13px;color:var(--ink-2)}
.stat b{font-family:var(--font-num);font-size:22px;font-weight:600}
.stat span{font-size:13px;color:var(--ink-2);margin-left:3px}
.topic-chips{display:flex;flex-wrap:wrap;gap:8px}
.topic-chips .cat.off{background:var(--cream-2);color:#8A93A1}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.inv{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;background:var(--cream);text-align:center;font-size:14px;font-weight:700}
.inv svg{height:48px;width:60px}
.inv small{font-size:12px;color:var(--ink-2);font-weight:500}
.inv .btn{min-height:34px;padding:0 10px;font-size:13px;border-radius:10px;margin-top:2px}
.log-list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.log-list li:last-child{border-bottom:0}
.log-list .cat{margin-top:2px}
.log-list b{display:block;font-size:15px}
.log-list small{display:block;font-size:13px;color:var(--ink-2)}

/* ---------- 右側欄 ---------- */
.rail-sec{margin-bottom:22px}
.rail-sec .sec-title{font-size:16px}
.rq-list{display:flex;flex-direction:column;gap:8px}
.rq{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:14px;background:#fff;text-align:left;cursor:pointer;box-shadow:var(--shadow-card)}
.rq:hover:not([disabled]){box-shadow:inset 0 0 0 1.5px var(--navy)}
.rq[disabled]{background:var(--cream-2);box-shadow:none;cursor:default}
.rq .cat{width:34px;height:34px;padding:0;justify-content:center;border-radius:10px}
.rq .cat .ic{width:18px;height:18px}
.rq span.t{flex:1;min-width:0}
.rq b{display:block;font-size:15px}
.rq small{display:block;font-size:13px;color:var(--ink-2)}
.rq .chev{color:var(--slate)}
.act-list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.act-list li:last-child{border-bottom:0}
.act-list .t{flex:1;min-width:0}
.act-list .t b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-list .t small{color:var(--ink-2);font-size:12px}
.amt{font-family:var(--font-num);font-weight:600;font-size:16px;white-space:nowrap}
.amt.plus{color:var(--teal-ink)}
.amt.minus{color:var(--navy)}
.tx-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;flex:none;background:var(--cream-2);color:var(--navy)}
.tx-ic .ic{width:18px;height:18px}
.tx-ic.in{background:var(--teal-soft);color:var(--teal-ink)}
.tx-ic.save{background:var(--yellow-soft);color:#6B4E00}

/* ---------- Sheet / Dialog ---------- */
.scrim{position:absolute;inset:0;z-index:100;background:rgba(22,36,58,.48);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:101;display:flex;flex-direction:column;max-height:92%;background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px -12px rgba(22,36,58,.5);animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);outline:none}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.sheet-quest{height:calc(100% - 16px);max-height:none}
.grabber{width:42px;height:5px;margin:8px auto 0;border-radius:3px;background:var(--cream-3);flex:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;flex:none}
.sheet-head h2{flex:1;font-size:20px;font-weight:800;min-width:0}
.sheet-body{flex:1;overflow-y:auto;padding:4px 16px 22px;overscroll-behavior:contain}
.sheet-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
.sheet-foot .note{flex-basis:100%;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sheet-foot .note .ic{width:16px;height:16px;color:var(--yellow-deep)}
@container app (min-width:768px){
  .sheet{left:50%;top:50%;right:auto;bottom:auto;width:min(540px,calc(100% - 48px));max-height:min(88%,820px);transform:translate(-50%,-50%);border-radius:26px;animation:pop .24s cubic-bezier(.2,.8,.2,1)}
  .sheet-quest{width:min(700px,calc(100% - 48px));height:min(90%,880px)}
  .sheet-foot{border-radius:0 0 26px 26px;padding:14px 20px 16px}
  .sheet-head{padding:18px 20px 10px}
  .sheet-body{padding:4px 20px 24px}
  .grabber{display:none}
}
@keyframes pop{from{transform:translate(-50%,-47%) scale(.97);opacity:0}}

.art-stage{display:grid;place-items:center;height:170px;margin-bottom:14px;border-radius:20px;background:radial-gradient(circle at 50% 50%,#FBF7EF 0 40%,transparent 41%) 0 0/24px 24px,var(--cream-2)}
.art-stage svg{height:78%;max-width:70%}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.desc{font-size:16px}
.pricebox{display:grid;gap:8px;padding:14px;margin-top:14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.pricebox .row{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.pricebox .row .num{font-size:18px;display:inline-flex;align-items:center;gap:5px}
.pricebox .arrow{color:var(--slate);margin:0 4px;font-family:var(--font-zh)}
.think{display:flex;gap:10px;padding:12px 14px;margin-top:12px;border-radius:14px;background:var(--yellow-soft);font-size:15px}
.think .ic{color:#8A6500;margin-top:2px}
.warn{display:flex;gap:10px;padding:12px 14px;margin-top:12px;border-radius:14px;background:var(--coral-soft);color:var(--coral-ink);font-size:15px;font-weight:700}
.warn .ic{margin-top:2px}
.okbox{display:flex;gap:10px;padding:12px 14px;margin-top:12px;border-radius:14px;background:var(--teal-soft);color:var(--teal-ink);font-size:15px;font-weight:700}

/* 數量調整 */
.amount{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px}
.amount .num{font-size:44px;min-width:110px;text-align:center;line-height:1}
.amount .unit{display:block;font-size:13px;color:var(--ink-2);text-align:center;font-family:var(--font-zh);font-weight:500;margin-top:4px}
.step{display:inline-grid;place-items:center;width:52px;height:52px;border:0;border-radius:16px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px var(--navy),0 4px 0 var(--navy)}
.step:not([disabled]):active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--navy),0 1px 0 var(--navy)}
.step[disabled]{box-shadow:inset 0 0 0 2px var(--cream-3),0 4px 0 var(--cream-3);color:#A3ACB9;cursor:not-allowed}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.quick .chip{height:36px}
.field{display:block;margin:14px 0}
.field span{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:48px;padding:0 14px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font:inherit;font-size:16px;color:var(--navy)}
.field input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--navy)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border:0;border-radius:16px;background:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:14px}
.pick svg{height:56px;width:70px}
.pick small{font-family:var(--font-num);font-weight:600;color:var(--ink-2);font-size:14px}
.pick .ic.big{width:40px;height:40px;margin:8px 0;color:var(--teal-deep)}
.pick[aria-checked="true"]{background:var(--yellow-soft);box-shadow:inset 0 0 0 2.5px var(--navy)}

/* 任務流程 */
.steps{display:flex;gap:6px;padding:0 16px 8px;flex:none}
.steps li{flex:1;height:30px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--cream-2);color:var(--ink-2);font-size:13px;font-weight:700}
.steps li.on{background:var(--navy);color:#fff}
.steps li.ok{background:var(--teal-soft);color:var(--teal-ink)}
@container app (min-width:768px){.steps{padding:0 20px 10px}}
.story{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.story-art{flex:none;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:112px;height:100px;padding:6px;border-radius:14px;background:radial-gradient(circle at 50% 50%,#FBF7EF 0 40%,transparent 41%) 0 0/18px 18px,var(--cream-2)}
.story-art svg{height:90%;max-width:62%}
.story-art svg.s{height:42%}
.story-text p{font-size:16px}
.story-text p+p{margin-top:6px}
.story-text b{font-family:var(--font-num);font-weight:600;background:var(--yellow-soft);padding:0 4px;border-radius:5px}
@container app (max-width:520px){.story{flex-direction:column;align-items:stretch}.story-art{width:100%;height:110px}}
.res-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:12px}
.res{padding:10px 12px;border-radius:14px;background:var(--cream-2)}
.res small{display:block;font-size:13px;color:var(--ink-2)}
.res b{font-family:var(--font-num);font-weight:600;font-size:22px;display:inline-flex;align-items:center;gap:4px}
.sim-note{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.sim-note .ic{width:16px;height:16px}
.q-ask{font-size:18px;font-weight:800;margin:18px 0 10px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:16px;background:#fff;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 rgba(32,51,79,.06);transition:box-shadow .15s,background .15s}
.opt:hover{box-shadow:inset 0 0 0 2px var(--slate),0 3px 0 rgba(32,51,79,.08)}
.opt-key{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:11px;background:var(--cream-2);font-family:var(--font-num);font-weight:700;font-size:18px}
.opt-text{flex:1}
.opt-text b{display:block;font-size:16px}
.opt-text small{display:block;font-size:14px;color:var(--ink-2)}
.opt-check{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--cream-3);color:transparent}
.opt-check .ic{width:16px;height:16px}
.opt[aria-checked="true"]{background:var(--yellow-soft);box-shadow:inset 0 0 0 2.5px var(--navy),0 3px 0 var(--navy)}
.opt[aria-checked="true"] .opt-key{background:var(--navy);color:var(--yellow)}
.opt[aria-checked="true"] .opt-check{background:var(--navy);color:var(--yellow);box-shadow:none}
.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jar{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 8px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.jar svg{width:56px;height:66px}
.jar b{font-size:16px;margin-top:4px}
.jar small{font-size:12px;color:var(--ink-2);line-height:1.4;min-height:34px}
.jar .stepper{display:flex;align-items:center;gap:6px;margin-top:8px}
.jar .stepper .num{font-size:22px;min-width:34px}
.jar .step{width:38px;height:38px;border-radius:12px}
.jar .step .ic{width:18px;height:18px}
@container app (max-width:520px){
  .jars{grid-template-columns:1fr;gap:8px}
  .jar{flex-direction:row;align-items:center;gap:12px;text-align:left;padding:10px 12px}
  .jar svg{width:40px;height:48px;flex:none}
  .jar-info{flex:1;min-width:0}
  .jar small{min-height:0}
  .jar .stepper{margin-top:0}
}
.alloc-left{text-align:center;margin-top:12px;font-weight:700}
.alloc-left b{font-family:var(--font-num);font-size:20px;color:var(--coral-ink)}
.alloc-left.done{color:var(--teal-ink)}
.recap{padding:12px 14px;border-radius:16px;background:var(--navy);color:#fff}
.recap small{display:block;font-size:13px;color:#B9C5D6}
.recap b{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.stats .stat{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.viz{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px}
.viz-head{display:flex;justify-content:space-between;font-weight:700}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin-top:8px;background:var(--cream-3)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.procon{display:grid;gap:10px;margin-top:12px}
@container app (min-width:600px){.procon{grid-template-columns:1fr 1fr}}
.pc{padding:12px 14px;border-radius:16px}
.pc h4{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:6px}
.pc li{font-size:15px;padding-left:14px;position:relative}
.pc li+li{margin-top:4px}
.pc li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.6}
.pc.pro{background:var(--teal-soft);color:#1F5E52}
.pc.con{background:var(--yellow-soft);color:#5C4300}
.no-answer{margin-top:12px;font-size:14px;color:var(--ink-2)}
.no-answer b{color:var(--navy);margin-right:6px}
.reflect{margin-top:14px;padding:14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--navy),0 4px 0 var(--navy)}
.reflect small{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--navy);color:var(--yellow);font-size:12px;font-weight:700}
.reflect p{font-size:17px;font-weight:700;margin:8px 0 4px}
.reflect span{font-size:13px;color:var(--ink-2)}
.lvl-hero{display:grid;place-items:center;gap:6px;padding:18px 0 8px;text-align:center}
.lvl-hero .big{display:grid;place-items:center;width:96px;height:84px;border-radius:18px;background:var(--yellow);box-shadow:0 6px 0 var(--yellow-deep);font-family:var(--font-num);font-weight:700;font-size:34px;position:relative}
.lvl-hero .big::before,.lvl-hero .big::after{content:"";position:absolute;top:-9px;width:22px;height:10px;border-radius:5px 5px 0 0;background:var(--yellow)}
.lvl-hero .big::before{left:18px}.lvl-hero .big::after{right:18px}
.lvl-hero h3{font-size:20px;margin-top:10px}
.unlock-list li{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-top:8px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.unlock-list svg{width:36px;height:36px}
.ledger-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.ledger-sum .stat b{font-size:19px}
.ledger li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.ledger li:last-child{border-bottom:0}
.ledger .t{flex:1;min-width:0}
.ledger .t b{display:block;font-size:15px}
.ledger .t small{display:block;font-size:12px;color:var(--ink-2)}
.ledger .r{text-align:right}
.ledger .r small{display:block;font-size:12px;color:var(--ink-2);font-family:var(--font-num)}
.bal-hero{display:flex;align-items:center;gap:10px;padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.bal-hero svg{width:44px;height:44px}
.bal-hero small{display:block;font-size:13px;color:var(--ink-2)}
.bal-hero b{font-family:var(--font-num);font-weight:600;font-size:32px;line-height:1.1}

/* Toast */
.toast-root{position:absolute;left:0;right:0;bottom:92px;z-index:200;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.device.is-building .toast-root{bottom:auto;top:72px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:460px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--navy);color:#fff;font-size:15px;font-weight:500;box-shadow:0 14px 30px -12px rgba(22,36,58,.6);animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.toast .btn{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.toast.no-act{padding:12px 18px}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}}
@container app (min-width:768px){.toast-root{bottom:28px}.device.is-building .toast-root{bottom:28px;top:auto}}

/* 積木彩帶 */
.fx{position:absolute;inset:0;z-index:300;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-24px;left:var(--x);width:14px;height:9px;border-radius:2px;background:var(--c);animation:fall var(--d) cubic-bezier(.25,.6,.45,1) var(--dl) forwards}
.cf::before{content:"";position:absolute;top:-3px;left:4px;width:6px;height:4px;border-radius:2px 2px 0 0;background:inherit}
@keyframes fall{to{transform:translate(var(--dx),1100px) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .fx{display:none}
}
</style>

/* 模擬伺服器處理：按鈕進入處理中，避免重複送出 */
function serverish(fn) {

function checkPlace(type, x, y, ignoreId) {
  const it = ITEMS[type];
  for (let dy = 0; dy < it.h; dy++) for (let dx = 0; dx < it.w; dx++) {
    if (!isLand(x + dx, y + dy)) return { ok:false, msg:'超出島嶼範圍了，要放在綠色的土地上' };
  }
  for (const o of state.objects) {
    if (o.id === ignoreId) continue;
    const oi = ITEMS[o.type];
    if (x < o.x + oi.w && x + it.w > o.x && y < o.y + oi.h && y + it.h > o.y) return { ok:false, msg:`和「${oi.name}」重疊了，換個位置吧` };
  }
  return { ok:true, msg:'這裡可以放！' };
}
function findSpot(type, ignoreId) {
  const it = ITEMS[type], cands = [];
  /* 離中心近、周圍空曠的位置優先，避免一放就和其他建築擠在一起 */
  const busy = (x, y) => state.objects.some(o => o.id !== ignoreId && !ITEMS[o.type].flat && x >= o.x && x < o.x + ITEMS[o.type].w && y >= o.y && y < o.y + ITEMS[o.type].h);
  for (let y = 0; y <= ROWS - it.h; y++) for (let x = 0; x <= COLS - it.w; x++) {
    let crowd = 0;
    for (let dy = -1; dy <= it.h; dy++) for (let dx = -1; dx <= it.w; dx++) if (busy(x + dx, y + dy)) crowd++;
    cands.push({ x, y, d:Math.hypot(x + it.w / 2 - 4.5, y + it.h / 2 - 4.5) + crowd * 1.5 });
  }
  cands.sort((a, b) => a.d - b.d);
  const hit = cands.find(c => checkPlace(type, c.x, c.y, ignoreId).ok);
  return hit ? { x:hit.x, y:hit.y } : null;
}
function freeCells() {
  let n = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!isLand(x, y)) continue;
    if (!state.objects.some(o => x >= o.x && x < o.x + ITEMS[o.type].w && y >= o.y && y < o.y + ITEMS[o.type].h)) n++;
  }
  return n;
}
function shopState(t) {
  const it = ITEMS[t];
  if (it.goalOnly) return hasUnique(t) ? 'owned' : 'goal';
  if (it.unique && hasUnique(t)) return 'owned';
  if (it.minLevel && levelOf(state.xp) < it.minLevel) return 'locked';
  if (state.balance < it.price) return 'poor';
  return 'buy';
}

function goalArt(g, cls = 'gcard-art') {

  return `<div class="${cls} ${done ? '' : 'locked'}">${g.reward ? artSVG(g.reward) : icon('piggy', 'big')}${cls === 'gcard-art' && !done && g.reward ? `<span class="lockdot">${icon('lock')}</span>` : ''}</div>`;
}
function goalCard(g) {
  const pct = Math.round(g.saved / g.target * 100), left = g.target - g.saved, active = g.status === 'active';
  const item = g.reward ? ITEMS[g.reward] : null;
  let foot;
  if (active) {
    foot = `<p class="gleft">還差 <b>${left}</b> 積木幣 · 如果每週存 20，大約 ${Math.ceil(left / 20)} 週後達成</p>
      <div class="gactions"><button class="btn btn-secondary btn-sm" data-action="goal-out" data-id="${g.id}" ${g.saved ? '' : 'disabled'}>${icon('arrowOut')}取回</button>
      <button class="btn btn-primary btn-sm" data-action="goal-in" data-id="${g.id}">${icon('arrowIn')}存入</button></div>`;
  } else {
    const canPlace = item && placeable(g.reward) && (state.inv[g.reward] || 0) > 0;
    foot = `<p class="gleft">${item ? `「${item.name}」已經解鎖${canPlace ? '，放進收藏了' : ''}。` : '這個目標完成了，做得好！'}</p>
      ${canPlace ? `<div class="gactions"><button class="btn btn-success btn-sm" data-action="build-with" data-type="${g.reward}">${icon('hammer')}放到島上</button></div>` : ''}`;
  }
  return `<article class="card gcard">
    ${goalArt(g)}
    <div class="gcard-body">
      <div class="gcard-title"><h3>${esc(g.title)}</h3>${active ? '' : `<span class="qstate done">${icon('check')}已達成</span>`}</div>
      <div class="gnums"><span class="num big">${g.saved}</span><span>/ ${g.target} 積木幣</span><span class="gpct">${pct}%</span></div>
      ${bricks(pct, '', `${g.title} 儲蓄進度`)}
      ${foot}
    </div>
  </article>`;
}
function goalMini(g) {
  const pct = Math.round(g.saved / g.target * 100);
  return `<div class="card gmini">
    ${goalArt(g, 'gmini-art')}
    <div class="gmini-body"><b>${esc(g.title)}</b>${bricks(pct, '', `${g.title} 儲蓄進度`)}<small><span class="num">${g.saved} / ${g.target}</span> · 還差 ${g.target - g.saved}</small></div>
    <button class="btn btn-primary btn-sm" data-action="goal-in" data-id="${g.id}">存入</button>
  </div>`;
}
function viewGoals() {
  const act = activeGoals(), done = state.goals.filter(g => g.status === 'completed');
  return `<section>
    <div class="view-head"><div><h1>儲蓄目標</h1><p>把積木幣放進目標，就不會不小心花掉。計畫改變時，隨時都可以取回。</p></div>
      <button class="btn btn-secondary btn-sm" data-action="goal-new" ${act.length >= 3 ? 'disabled' : ''}>${icon('plus')}新增目標</button></div>
    ${act.length >= 3 ? `<p class="ghint">${icon('info')}一次最多 3 個進行中的目標，先完成或取回其中一個吧。</p>` : ''}
    <div class="ggrid">${act.length ? act.map(goalCard).join('') : `<div class="card empty">還沒有儲蓄目標。挑一個想要的建築，開始存積木幣吧！<br><button class="btn btn-primary btn-sm" data-action="goal-new">新增目標</button></div>`}</div>
    ${done.length ? `<h2 class="sec-title" style="margin-top:26px">已達成</h2><div class="ggrid">${done.map(goalCard).join('')}</div>` : ''}
  </section>`;
}

  const x = xpInfo(), doneN = Object.keys(state.done).length;
  const inv = placeableInv();
  const wears = Object.keys(ITEMS).filter(t => ITEMS[t].cat === 'wear' && state.owned[t]);

  return `<section>
    <div class="view-head"><div><h1>我的</h1></div></div>

      <div class="card me-sec span-all">

        <div class="stats3">
          <div class="stat"><small>完成任務</small><b>${doneN}</b><span>/ ${QUESTS.length}</span></div>
          <div class="stat"><small>島上作品</small><b>${state.objects.length}</b><span>件</span></div>

        <div class="topic-chips">${Object.entries(CATS).map(([k, c]) => {
          const on = QUESTS.some(q => q.cat === k && state.done[q.id]);

        }).join('')}</div>
      </div>
      <div class="card me-sec"><h2>積木幣帳本<button class="link" data-action="ledger">查看帳本</button></h2>
        <p style="font-size:15px">目前有 <b class="num">${state.balance}</b> 積木幣，共 ${state.tx.length} 筆紀錄。每一筆變動都會記下來。</p>
      </div>
      <div class="card me-sec span-all"><h2>我的收藏</h2>
        ${inv.length || wears.length ? `<div class="inv-grid">
          ${inv.map(t => `<div class="inv">${artSVG(t)}${ITEMS[t].name}<small>還沒放 ×${state.inv[t]}</small><button class="btn btn-secondary" data-action="build-with" data-type="${t}">放到島上</button></div>`).join('')}
          ${wears.map(t => `<div class="inv">${artSVG(t)}${ITEMS[t].name}<small>${state.user.hat === t ? '戴著' : '造型'}</small><button class="btn ${state.user.hat === t ? 'btn-secondary' : 'btn-primary'}" data-action="wear" data-type="${t}">${state.user.hat === t ? '摘下' : '戴上'}</button></div>`).join('')}
        </div>` : `<p class="empty" style="padding:6px 0">收藏是空的。島上的作品都已經放好了！</p>`}
      </div>
      <div class="card me-sec span-all"><h2>學習紀錄</h2>
        ${state.log.length ? `<ul class="log-list">${state.log.slice(0, 8).map(l => {
          const q = QUESTS.find(q => q.id === l.id);
          return `<li><span class="cat cat-${q.cat}">${CATS[q.cat].label}</span><div><b>${q.title}</b><small>你選了：${esc(l.label)} · ${when(l.at)}${l.rewarded ? '' : ' · 再玩一次'}</small><small>思考題：${q.reflect}</small></div></li>`;
        }).join('')}</ul>` : `<p class="empty" style="padding:6px 0">完成任務後，這裡會記下你的選擇和想法。</p>`}

/* =========================================================
   右側欄（桌面）

function viewRail() {
  const g = topGoal();
  return `
    ${!state.log.length ? `<div class="rail-sec">${welcomeCard()}</div>` : ''}

      <div class="rq-list">${QUESTS.map(q => {
        const st = questState(q), c = CATS[q.cat];
        const sub = st === 'done' ? '已完成 · 獎勵已領取' : st === 'locked' ? `Lv.${q.minLevel} 解鎖` : `+${q.xp} 經驗 · +${q.coins} 積木幣`;
        return `<button class="rq" data-action="quest-open" data-id="${q.id}" ${st === 'locked' ? 'disabled' : ''}><span class="cat cat-${q.cat}">${icon(st === 'locked' ? 'lock' : st === 'done' ? 'check' : c.icon)}</span><span class="t"><b>${q.title}</b><small>${sub}</small></span>${st === 'locked' ? '' : `<span class="chev">${icon('chev')}</span>`}</button>`;
      }).join('')}</div></section>
    <section class="rail-sec"><h2 class="sec-title">儲蓄目標<button class="link" data-action="nav" data-view="goals">全部</button></h2>

    <section class="rail-sec"><h2 class="sec-title">近期活動<button class="link" data-action="ledger">帳本</button></h2>
      <div class="card" style="padding:4px 14px"><ul class="act-list">${state.tx.slice(0, 5).map(txRow).join('')}</ul></div></section>`;

function txRow(t) {
  const m = TX_META[t.type];
  return `<li><span class="tx-ic ${m.tone}">${icon(m.ic)}</span><span class="t"><b>${esc(t.desc)}</b><small>${when(t.at)}</small></span><span class="amt ${t.amount > 0 ? 'plus' : 'minus'}">${t.amount > 0 ? '+' : '−'}${Math.abs(t.amount)}</span></li>`;
}

/* =========================================================
   Sheet / Dialog
   ========================================================= */
function sheetFrame({ title, body, foot = '', cls = '', head = '' }) {
  return `<div class="scrim" data-action="close"></div>
  <div class="sheet ${cls}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">${head}<h2 id="sheet-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="關閉">${icon('x')}</button></div>
    ${cls.includes('sheet-quest') ? questSteps() : ''}
    <div class="sheet-body">${body}</div>
    ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}
  </div>`;
}
function viewOverlay() {
  const s = ui.sheet;
  if (!s) return '';
  switch (s.type) {
    case 'quest': return questSheet();
    case 'item': return itemSheet();
    case 'goal-in': case 'goal-out': return goalMoveSheet();
    case 'goal-new': return goalNewSheet();
    case 'goal-done': return goalDoneSheet();
    case 'ledger': return ledgerSheet();
    case 'obj': return objSheet();
    case 'levelup': return levelSheet();
    case 'reset': return sheetFrame({ title:'重設原型資料？', body:'<p>會回到第一次打開的狀態：100 積木幣、夢想小屋存了 90、還沒完成任何任務。</p>',
      foot:'<button class="btn btn-secondary" data-action="close">取消</button><button class="btn btn-danger" data-action="reset">重設</button>' });
  }
  return '';
}

/* --- 任務流程 --- */
function questSteps() {
  const st = ui.sheet.step;
  return `<ol class="steps" aria-label="任務步驟"><li class="${st === 'play' ? 'on' : 'ok'}" ${st === 'play' ? 'aria-current="step"' : ''}>1 情境與選擇</li><li class="${st === 'result' ? 'on' : ''}" ${st === 'result' ? 'aria-current="step"' : ''}>2 結果與反思</li></ol>`;
}
function allocLeft(a) { return 50 - a.spend - a.save - a.share; }
function questResult(q, s) {
  if (q.kind === 'alloc') {
    const a = s.alloc, pros = [], cons = [];
    if (a.save >= 25) pros.push('一半以上存起來，為以後的大目標做準備。');
    if (a.spend >= 25) pros.push('你重視現在就能享受的東西，這也很重要。');
    if (a.share > 0) pros.push('你留了一份給別人，分享也是管理金錢的一部分。');
    if (a.spend >= 10 && a.save >= 10 && a.share >= 10) pros.push('三個罐子都照顧到了，用起來很有彈性。');
    if (!pros.length) pros.push('你有自己的分配想法，試著說說看為什麼這樣分。');
    if (a.save === 0) cons.push('這次沒有存錢，遇到大目標時可能要花更久才能達成。');
    if (a.spend === 0) cons.push('花用罐是空的，這週想買小東西時要先想好怎麼辦。');
    if (a.share === 0) cons.push('這次沒有分享也沒關係，可以想想什麼時候會想幫助別人。');
    if (a.save > 0 && a.save < 15) cons.push('儲蓄罐比較少，存到大目標的速度會慢一些。');
    if (!cons.length) cons.push('分得很平均時，每一罐累積的速度都會慢一點。');
    return {
      label:`花用 ${a.spend}、儲蓄 ${a.save}、分享 ${a.share}`,
      stats:[['花用罐', a.spend, '積木幣'], ['儲蓄罐', a.save, '積木幣'], ['分享罐', a.share, '積木幣']],
      viz:`<div class="viz"><div class="viz-head"><span>50 積木幣怎麼分</span></div>
        <div class="stack">${JARS.map(j => `<i style="width:${a[j.key] * 2}%;background:${j.color}"></i>`).join('')}</div>
        <div class="legend">${JARS.map(j => `<span style="--c:${j.color}">${j.label} ${a[j.key] * 2}%</span>`).join('')}</div></div>`,
      pros, cons,
    };
  }
  const o = q.options.find(o => o.key === s.choice);
  const viz = o.goal !== undefined
    ? `<div class="viz"><div class="viz-head"><span>夢想小屋進度</span><span class="num">${o.goal} / 150</span></div>${bricks(o.goal / 150 * 100, '', '故事中夢想小屋的進度')}</div>` : '';
  return { label:`${o.key}. ${o.text}`, stats:o.stats, viz, pros:o.pros, cons:o.cons };
}
function questSheet() {
  const s = ui.sheet, q = QUESTS.find(x => x.id === s.id), c = CATS[q.cat];
  const done = !!state.done[q.id];
  const head = `<span class="cat cat-${q.cat}">${icon(c.icon)}${c.label}</span>`;
  if (s.step === 'play') {
    let choose;
    if (q.kind === 'alloc') {
      const a = s.alloc, left = allocLeft(a);
      choose = `<div class="jars">${JARS.map(j => `<div class="jar">${jarSVG(a[j.key] / 50, j.color)}<div class="jar-info"><b>${j.label}</b><br><small>${j.desc}</small></div>
          <div class="stepper"><button class="step" data-action="alloc" data-jar="${j.key}" data-d="-5" aria-label="${j.label}罐減少 5" ${a[j.key] <= 0 ? 'disabled' : ''}>${icon('minus')}</button>
          <span class="num" aria-label="${j.label}罐 ${a[j.key]} 積木幣">${a[j.key]}</span>
          <button class="step" data-action="alloc" data-jar="${j.key}" data-d="5" aria-label="${j.label}罐增加 5" ${left <= 0 ? 'disabled' : ''}>${icon('plus')}</button></div></div>`).join('')}</div>
        <p class="alloc-left ${left ? '' : 'done'}" aria-live="polite">${left ? `還有 <b>${left}</b> 積木幣還沒分配` : '全部分配好了！'}</p>`;
    } else {
      choose = `<div class="opts" role="radiogroup" aria-label="${q.ask}">${q.options.map(o => `<button class="opt" role="radio" aria-checked="${s.choice === o.key}" data-action="q-choose" data-key="${o.key}">
        <span class="opt-key">${o.key}</span><span class="opt-text"><b>${o.text}</b><small>${o.hint}</small></span><span class="opt-check">${icon('check')}</span></button>`).join('')}</div>`;
    }
    const can = q.kind === 'alloc' ? allocLeft(s.alloc) === 0 : !!s.choice;
    const art = q.art.map(a => a === 'jar' ? JARS.map(j => jarSVG(.6, j.color).replace('<svg ', '<svg class="s" style="height:62%" ')).join('') : artSVG(a, a === 'car' || a === 'cloud' ? 's' : '')).join('');
    const body = `
      <div class="story"><div class="story-art">${art}</div><div class="story-text">${q.story.map(p => `<p>${p}</p>`).join('')}</div></div>
      ${q.resources ? `<div class="res-row">${q.resources.map(([l, v]) => `<div class="res"><small>${l}</small><b>${coinSm()}${v}</b></div>`).join('')}</div>` : ''}
      <p class="sim-note">${icon('info')}這是故事裡的情境，不會用到你真正的積木幣。</p>
      <h3 class="q-ask">${q.ask}</h3>${choose}`;
    const note = done ? `<p class="note">${icon('check')}這個任務的獎勵已經領過了，可以自由試試不同的選擇。</p>`
      : `<p class="note">完成可得 ${icon('star')}+${q.xp} 經驗、${coinSm()}+${q.coins} 積木幣（不論選哪一個）</p>`;
    return sheetFrame({ title:q.title, head, cls:'sheet-quest', body,
      foot:`${note}<button class="btn btn-primary" data-action="q-confirm" ${can ? '' : 'disabled'}>${q.kind === 'alloc' ? '完成分配' : '就選這個'}</button>` });
  }
  const r = questResult(q, s);
  const body = `
    <div class="recap"><small>你的選擇</small><b>${esc(r.label)}</b></div>
    <div class="stats">${r.stats.map(([l, v, u]) => `<div class="stat"><small>${l}</small><b${typeof v === 'string' ? ' style="font-family:var(--font-zh);font-size:17px;font-weight:700"' : ''}>${v}</b>${u ? `<span>${u}</span>` : ''}</div>`).join('')}</div>
    ${r.viz}
    <div class="procon">
      <div class="pc pro"><h4>${icon('thumb')}好處</h4><ul>${r.pros.map(p => `<li>${p}</li>`).join('')}</ul></div>
      <div class="pc con"><h4>${icon('bulb')}要想一想</h4><ul>${r.cons.map(p => `<li>${p}</li>`).join('')}</ul></div>
    </div>
    <p class="no-answer"><b>沒有標準答案</b>每個選擇都有好處，也有要付出的代價。重要的是想清楚自己為什麼這樣選。</p>
    <div class="reflect"><small>思考題</small><p>${q.reflect}</p><span>可以和家人聊聊你的想法</span></div>`;
  const claim = done
    ? `<button class="btn btn-success" data-action="q-claim" ${busyAttr()}>${icon('check')}完成</button>`
    : `<button class="btn btn-primary" data-action="q-claim" ${busyAttr()}>${ui.busy ? '領取中' : `領取獎勵 +${q.xp} 經驗 +${q.coins} 幣`}</button>`;
  return sheetFrame({ title:q.title, head, cls:'sheet-quest', body,
    foot:`<button class="btn btn-secondary" data-action="q-back" ${ui.busy ? 'disabled' : ''}>換個選擇看看</button>${claim}` });
}

/* --- 商品 --- */
function itemSheet() {
  const t = ui.sheet.t, it = ITEMS[t], st = shopState(t), after = state.balance - it.price;
  const g = state.goals.find(g => g.reward === t && g.status === 'active');
  let info = '', foot = '';
  if (st === 'buy') {
    info = `<div class="think">${icon('bulb')}<span>想一想：這是你「需要」的，還是「想要」的？兩種都可以，想清楚再決定就好。</span></div>`;
    foot = `<button class="btn btn-secondary" data-action="close" ${ui.busy ? 'disabled' : ''}>再想想</button><button class="btn btn-primary" data-action="buy" data-type="${t}" ${busyAttr()}>${ui.busy ? '購買中' : `確認購買 · ${it.price}`}</button>`;
  } else if (st === 'poor') {
    info = `<div class="warn">${icon('info')}<span>還差 ${it.price - state.balance} 積木幣。可以先完成任務，或把它設成儲蓄目標，一點一點存。</span></div>`;
    foot = `<button class="btn btn-secondary" data-action="nav" data-view="quests">去做任務</button>${g ? `<button class="btn btn-primary" data-action="nav" data-view="goals">查看儲蓄目標</button>` : `<button class="btn btn-primary" data-action="goal-from-item" data-type="${t}">${icon('piggy')}設成儲蓄目標</button>`}`;
  } else if (st === 'locked') {
    info = `<div class="think">${icon('lock')}<span>升到 Lv.${it.minLevel} 就能購買。完成理財任務可以得到經驗值。</span></div>`;
    foot = `<button class="btn btn-primary" data-action="nav" data-view="quests">去做任務</button>`;
  } else if (st === 'goal') {
    info = `<div class="think">${icon('piggy')}<span>這棟建築不在商店販售，存滿儲蓄目標就能解鎖。${g ? `目前已存 ${g.saved} / ${g.target}。` : ''}</span></div>`;
    foot = g ? `<button class="btn btn-primary" data-action="nav" data-view="goals">查看儲蓄目標</button>` : `<button class="btn btn-primary" data-action="goal-from-item" data-type="${t}">${icon('piggy')}建立儲蓄目標</button>`;
  } else {
    const canPlace = placeable(t) && (state.inv[t] || 0) > 0;
    info = `<div class="okbox">${icon('check')}<span>你已經擁有這個了。</span></div>`;
    foot = canPlace ? `<button class="btn btn-success" data-action="build-with" data-type="${t}">${icon('hammer')}放到島上</button>`
      : it.cat === 'wear' ? `<button class="btn btn-primary" data-action="wear" data-type="${t}">${state.user.hat === t ? '摘下' : '戴上'}</button>`
      : `<button class="btn btn-secondary" data-action="close">關閉</button>`;
  }
  const showPrice = st === 'buy' || st === 'poor';
  return sheetFrame({ title:it.name, body:`
    <div class="art-stage">${artSVG(t)}</div>
    <div class="kv"><span class="badge">${CAT_LABEL[it.cat]}</span>${it.w ? `<span class="badge">佔 ${it.w}×${it.h} 格</span>` : ''}<span class="badge">${it.unique ? '限購一次' : '可以重複購買'}</span></div>
    <p class="desc">${it.desc}</p>

/* =========================================================
   Render
   ========================================================= */
function setHTML(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } }
let opener = null, focusSheet = false;
function render() {
  $('#app').classList.toggle('is-building', !!ui.build);
  $('#device').classList.toggle('is-building', !!ui.build);
  setHTML($('#topbar'), viewTop());
  setHTML($('#sidenav'), viewNav('nav'));
  setHTML($('#tabbar'), viewNav('tab'));
  setHTML($('#main'), viewMain());
  setHTML($('#rail'), viewRail());
  setHTML($('#overlay'), viewOverlay());
  renderToast();
  ui.justPlaced = null;
  if (ui.bump) { ui.bump = false; setTimeout(() => $('.coinpill.bump')?.classList.remove('bump'), 700); }
  if (focusSheet) {
    focusSheet = false;
    const sh = $('.sheet');
    if (sh) (sh.querySelector('[data-autofocus]') || sh).focus();
  }
}
function renderToast() {
  const t = ui.toast;
  setHTML($('#toast'), t ? `<div class="toast ${t.action ? '' : 'no-act'}"><span>${esc(t.msg)}</span>${t.action ? `<button class="btn btn-primary" data-action="toast-act">${t.action.label}</button>` : ''}</div>` : '');
}
let toastTimer;
function toast(msg, action) {
  ui.toast = { msg, action };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { ui.toast = null; renderToast(); }, action ? 5200 : 3200);
  renderToast();
}
function openSheet(s) {
  if (!ui.sheet) opener = document.activeElement;
  ui.sheet = s; focusSheet = true; ui.toast = null;
}
function closeSheet() {
  ui.sheet = null;
  render();
  if (opener && opener.isConnected) opener.focus({ preventScroll:true });
  opener = null;
}
function go(view) {
  ui.view = view; ui.build = null; ui.sheet = null;
  render();
  $('#main').scrollTop = 0;
}
function bumpCoins(from) {
  ui.bump = true;
  if (reduceMotion()) return;
  const to = state.balance, t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / 650), v = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    document.querySelectorAll('[data-coin]').forEach(el => { el.textContent = v; });
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function burst() {
  if (reduceMotion()) return;
  const fx = $('#fx'), colors = [C.yel, C.teal, C.coral, C.navy, '#fff'];
  let h = '';
  for (let i = 0; i < 36; i++) {
    h += `<i class="cf" style="--x:${Math.random() * 100}%;--c:${colors[i % 5]};--d:${1.4 + Math.random() * 1.2}s;--dl:${Math.random() * .35}s;--dx:${(Math.random() - .5) * 160}px;--r:${(Math.random() - .5) * 900}deg"></i>`;
  }
  fx.innerHTML = h;
  setTimeout(() => { fx.innerHTML = ''; }, 3200);
}

/* =========================================================
   建造互動
   ========================================================= */
function startBuild(type, pickId) {
  ui.view = 'island'; ui.sheet = null;
  ui.build = { sel:null, ghost:null };
  if (type && state.inv[type] > 0) { ui.build.sel = { kind:'new', type }; ui.build.ghost = findSpot(type); }
  if (pickId) ui.build.sel = { kind:'pick', id:pickId };
  render();
  $('#main').scrollTop = 0;
}
function syncBuild() {
  const layer = $('#ghost-layer');
  if (layer) layer.innerHTML = ghostHTML();
  const st = buildStatus(), el = $('#build-status'), btn = $('#place-btn');
  if (el) { el.textContent = st.text; el.className = 'tray-status ' + st.tone; }
  if (btn) btn.disabled = st.tone !== 'ok';
  $('#live').textContent = st.text;
}
function anchorFromEvent(e, type) {
  const grid = $('.grid'), r = grid.getBoundingClientRect(), it = ITEMS[type];
  const fx = (e.clientX - r.left) / r.width * COLS, fy = (e.clientY - r.top) / r.height * ROWS;
  if (fx < -.5 || fy < -.5 || fx > COLS + .5 || fy > ROWS + .5) return null;
  return { x:clamp(Math.round(fx - it.w / 2), 0, COLS - it.w), y:clamp(Math.round(fy - it.h / 2), 0, ROWS - it.h) };
}
function confirmPlace() {
  const b = ui.build, s = b?.sel;
  if (!s || !b.ghost) return;
  const chk = checkPlace(s.type, b.ghost.x, b.ghost.y, s.kind === 'move' ? s.id : null);
  if (!chk.ok) { toast(chk.msg); return; }
  if (s.kind === 'new') {
    if (!(state.inv[s.type] > 0)) return;
    const o = { id:nid('o'), type:s.type, x:b.ghost.x, y:b.ghost.y };
    state.objects.push(o);
    state.inv[s.type]--;
    ui.justPlaced = o.id;
    b.sel = state.inv[s.type] > 0 ? { kind:'new', type:s.type } : null;
    b.ghost = null;
    toast(`放好了「${ITEMS[s.type].name}」${b.sel ? '，還可以再放一個' : ''}`);
  } else {
    const o = state.objects.find(o => o.id === s.id);
    o.x = b.ghost.x; o.y = b.ghost.y;
    ui.justPlaced = o.id;
    b.sel = null; b.ghost = null;
    toast(`「${ITEMS[o.type].name}」移好了`);
  }
  save(); render();
}
let drag = null, dragMoved = false;
document.addEventListener('pointerdown', e => {
  const s = ui.build?.sel;
  if (!s || !(s.kind === 'new' || s.kind === 'move') || !e.target.closest('.grid')) return;
  dragMoved = false;
  if (e.pointerType !== 'mouse') drag = { x:e.clientX, y:e.clientY, id:e.pointerId };
});
document.addEventListener('pointermove', e => {
  const b = ui.build, s = b?.sel;
  if (!s || !(s.kind === 'new' || s.kind === 'move')) return;
  const hovering = e.pointerType === 'mouse' && e.buttons === 0 && e.target.closest('.grid');
  const dragging = drag && drag.id === e.pointerId && (dragMoved || Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6);
  if (!hovering && !dragging) return;
  if (dragging) dragMoved = true;
  const a = anchorFromEvent(e, s.type);
  if (a && (!b.ghost || a.x !== b.ghost.x || a.y !== b.ghost.y)) { b.ghost = a; syncBuild(); }
});
document.addEventListener('pointerup', () => { drag = null; });
document.addEventListener('pointercancel', () => { drag = null; });
function onBoard(e) {
  const b = ui.build, s = b?.sel;
  if (!b) return;
  if (!s || s.kind === 'pick') { if (s) { b.sel = null; render(); } return; }
  if (dragMoved) { dragMoved = false; return; }
  const a = anchorFromEvent(e, s.type);
  if (!a) return;
  if (b.ghost && a.x === b.ghost.x && a.y === b.ghost.y) { confirmPlace(); return; }
  b.ghost = a; syncBuild();
}

  /* 積木島 */

  alloc: el => {

  'q-claim': () => {
    const s = ui.sheet, q = QUESTS.find(x => x.id === s.id), label = questResult(q, s).label;
    const from = state.balance, lvBefore = levelOf(state.xp);
    serverish(() => {

      }

      ui.sheet = null;
      const lvAfter = levelOf(state.xp);

      else toast('完成！這個任務的獎勵之前已經領過了');

  /* 商店 */
  scat: el => { ui.shopCat = el.dataset.cat; render(); },
  'item-open': el => { openSheet({ type:'item', t:el.dataset.type }); render(); },
  buy: el => {
    const t = el.dataset.type, it = ITEMS[t];
    serverish(() => {
      if (shopState(t) !== 'buy') return;   // 伺服器再檢查一次價格、餘額與限購
      addTx('purchase', -it.price, `購買「${it.name}」`);
      if (it.cat === 'wear') state.owned[t] = true;
      else { state.inv[t] = (state.inv[t] || 0) + 1; if (it.unique) state.owned[t] = true; }
      const g = state.goals.find(g => g.status === 'active' && g.reward === t);
      if (g && it.unique) {   // 已經買到了，原本為它存的錢退回錢包
        if (g.saved > 0) addTx('goal_withdrawal', g.saved, `目標「${g.title}」結束，取回`);

    });
  },
  'goal-from-item': el => {
    const t = el.dataset.type;
    if (activeGoals().length >= 3) { toast('一次最多 3 個進行中的目標'); return; }
    state.goals.unshift({ id:nid('g'), title:ITEMS[t].name, target:ITEMS[t].price, saved:0, reward:t, status:'active' });
    save(); go('goals');
    toast(`已建立目標「${ITEMS[t].name}」`);
  },
  wear: el => {
    const t = el.dataset.type;
    state.user.hat = state.user.hat === t ? null : t;
    save(); ui.sheet = null; render();
    toast(state.user.hat ? `戴上了「${ITEMS[t].name}」` : '摘下帽子了');
  },

  /* 儲蓄目標 */
  'goal-in': el => {
    const g = state.goals.find(g => g.id === el.dataset.id);
    openSheet({ type:'goal-in', id:g.id, amount:Math.min(20, state.balance, g.target - g.saved) }); render();
  },
  'goal-out': el => {
    const g = state.goals.find(g => g.id === el.dataset.id);
    openSheet({ type:'goal-out', id:g.id, amount:Math.min(20, g.saved) }); render();
  },
  amt: el => { ui.sheet.amount += +el.dataset.d; render(); },
  'amt-set': el => { ui.sheet.amount = +el.dataset.v; render(); },
  'goal-in-ok': () => {
    const s = ui.sheet;
    serverish(() => {
      const g = state.goals.find(g => g.id === s.id);
      const a = clamp(s.amount, 0, Math.min(state.balance, g.target - g.saved));
      if (a <= 0 || g.status !== 'active') return;
      addTx('goal_contribution', -a, `存入「${g.title}」`);
      g.saved += a;
      if (g.saved >= g.target) {
        g.status = 'completed';
        if (g.reward) { state.inv[g.reward] = (state.inv[g.reward] || 0) + 1; state.owned[g.reward] = true; }
        ui.sheet = { type:'goal-done', id:g.id }; focusSheet = true;
        burst();
      } else {
        ui.sheet = null;
        toast(`已存入 ${a} 積木幣，還差 ${g.target - g.saved}`);
      }
    });
  },
  'goal-out-ok': () => {
    const s = ui.sheet;
    serverish(() => {
      const g = state.goals.find(g => g.id === s.id);
      const a = clamp(s.amount, 0, g.saved);
      if (a <= 0) return;
      addTx('goal_withdrawal', a, `從「${g.title}」取回`);
      g.saved -= a;
      ui.sheet = null;
      toast(`取回 ${a} 積木幣，已回到錢包`);
    });
  },
  'goal-new': () => {
    if (activeGoals().length >= 3) { toast('一次最多 3 個進行中的目標'); return; }
    const c = goalCandidates();
    openSheet({ type:'goal-new', pick:c[0] || 'custom', title:'', amount:100 }); render();
  },
  gpick: el => { ui.sheet.pick = el.dataset.v; render(); if (el.dataset.v === 'custom') $('#goal-title')?.focus(); },
  gamt: el => { ui.sheet.amount = clamp(ui.sheet.amount + +el.dataset.d, 10, 500); render(); },
  'goal-create': () => {
    const s = ui.sheet, custom = s.pick === 'custom';
    const title = custom ? s.title.trim() : ITEMS[s.pick].name;
    const target = custom ? s.amount : ITEMS[s.pick].price;
    if (!title || target <= 0) return;
    state.goals.unshift({ id:nid('g'), title, target, saved:0, reward:custom ? null : s.pick, status:'active' });
    save(); go('goals');
    toast(`已建立目標「${title}」`);
  },
  lfilter: el => { ui.ledgerFilter = el.dataset.v; render(); },
};

document.addEventListener('click', e => {
  const pv = e.target.closest('[data-pv]');
  if (pv) { setPreview(pv.dataset.pv); return; }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') e.preventDefault();
  if (ui.toast && el.dataset.action !== 'toast-act' && el.closest('.sheet')) { ui.toast = null; }
  const fn = A[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'goal-title' && ui.sheet?.type === 'goal-new') {
    ui.sheet.title = e.target.value;
    $('#overlay')._h = null;   // 下次 render 時重畫，但這次不打斷輸入
    const btn = $('#goal-create');
    if (btn) btn.disabled = !(ui.sheet.title.trim() && ui.sheet.amount > 0);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ui.sheet) { if (!ui.busy) closeSheet(); return; }
    if (ui.build?.sel) { ui.build.sel = null; ui.build.ghost = null; render(); return; }
    if (ui.build) { ui.build = null; render(); return; }
  }
  if (e.key === 'Tab' && ui.sheet) {   // 對話框內循環焦點
    const f = [...$('.sheet').querySelectorAll('button:not([disabled]),input,[tabindex="0"]')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  const b = ui.build, s = b?.sel;
  if (s && (s.kind === 'new' || s.kind === 'move') && e.target.classList?.contains('grid')) {
    const d = { ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1] }[e.key];
    const it = ITEMS[s.type];
    if (d) {
      e.preventDefault();
      const g = b.ghost || findSpot(s.type) || { x:0, y:0 };
      b.ghost = { x:clamp(g.x + d[0], 0, COLS - it.w), y:clamp(g.y + d[1], 0, ROWS - it.h) };
      syncBuild();
    } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); confirmPlace(); $('.grid.placing')?.focus(); }
  }
});

/* 預覽寬度切換（原型工具） */
function setPreview(v) {
  document.body.dataset.preview = v;
  document.querySelectorAll('[data-pv]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pv === v));
  try { localStorage.setItem('wealth-blocks-preview', v); } catch (e) { /* 忽略 */ }
}
let pv = 'desktop';
try { pv = localStorage.getItem('wealth-blocks-preview') || 'desktop'; } catch (e) { /* 忽略 */ }
const qp = new URLSearchParams(location.search);
if (qp.get('preview')) pv = qp.get('preview');
setPreview(pv);
if (qp.get('view')) ui.view = qp.get('view');

render();
})();
</script>
</body>
</html>
